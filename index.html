<!DOCTYPE html>
<html lang="pt-BR" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" type="text/css" href="./styles/style.css" />
    <title>Junk Churrascômetro</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-layout">
      <header class="header">
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Alternar tema">☀</button>
        <div class="header-content">
          <img src="./assets/logo.png" alt="Junk Logo" class="logo" />
          <h1>Churrascômetro</h1>
          <p class="subtitle">Calcule os ingredientes perfeitos para seu churrasco</p>
        </div>
      </header>

      <main class="main-content">
        <div class="calculator-card">
          <div class="tab-nav">
            <button class="tab-btn active" id="tab-btn-churrasco" onclick="switchTab('churrasco')">🔥 Churrasco</button>
            <button class="tab-btn" id="tab-btn-sitio" onclick="switchTab('sitio')">🏡 Sítio</button>
          </div>

          <div id="tab-churrasco" class="tab-panel active">
            <form class="form-group" onsubmit="return false;">
              <div class="input-wrapper">
                <label for="adults" class="input-label">Adultos</label>
                <input
                  id="adults"
                  name="adults"
                  type="number"
                  placeholder="Quantidade de adultos"
                  min="0"
                  class="input-field"
                />
              </div>

              <div class="switch-row">
                <div class="switch-info">
                  <span class="switch-label-text">Crianças</span>
                  <span class="switch-hint">Haverá crianças no churrasco?</span>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="kids-toggle-churrasco" onchange="toggleKids('churrasco')">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </label>
              </div>

              <div id="kids-input-churrasco" class="intensity-wrapper hidden">
                <label for="kids" class="input-label">Quantidade de crianças</label>
                <input
                  id="kids"
                  name="kids"
                  type="number"
                  placeholder="Quantidade de crianças"
                  min="0"
                  class="input-field"
                />
              </div>

              <div class="input-wrapper">
                <label for="duration" class="input-label">Duração do evento (horas)</label>
                <input
                  id="duration"
                  name="duration"
                  type="number"
                  placeholder="Ex: 4"
                  min="0"
                  max="24"
                  class="input-field"
                />
              </div>

              <div class="switch-row">
                <div class="switch-info">
                  <span class="switch-label-text">Destilados</span>
                  <span class="switch-hint">Reduz cerveja e adiciona dose</span>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="destilados-churrasco" onchange="toggleDestilados('churrasco')">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </label>
              </div>

              <div id="destilados-options-churrasco" class="intensity-wrapper hidden">
                <label class="input-label">Quantidade de destilados</label>
                <div class="intensity-btns">
                  <button type="button" class="intensity-btn active" data-level="pouco" onclick="setIntensity('churrasco', 'pouco')">Pouco</button>
                  <button type="button" class="intensity-btn" data-level="medio" onclick="setIntensity('churrasco', 'medio')">Médio</button>
                  <button type="button" class="intensity-btn" data-level="muito" onclick="setIntensity('churrasco', 'muito')">Muito</button>
                </div>
              </div>

              <button class="btn btn-primary" onclick="calc()">Calcular</button>
            </form>
            <div id="result" class="result-container"></div>
          </div>

          <div id="tab-sitio" class="tab-panel">
            <form class="form-group" onsubmit="return false;">
              <div class="input-wrapper">
                <label for="sitio-adults" class="input-label">Adultos</label>
                <input
                  id="sitio-adults"
                  name="sitio-adults"
                  type="number"
                  placeholder="Quantidade de adultos"
                  min="0"
                  class="input-field"
                />
              </div>

              <div class="switch-row">
                <div class="switch-info">
                  <span class="switch-label-text">Crianças</span>
                  <span class="switch-hint">Haverá crianças no sítio?</span>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="kids-toggle-sitio" onchange="toggleKids('sitio')">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </label>
              </div>

              <div id="kids-input-sitio" class="intensity-wrapper hidden">
                <label for="sitio-kids" class="input-label">Quantidade de crianças</label>
                <input
                  id="sitio-kids"
                  name="sitio-kids"
                  type="number"
                  placeholder="Quantidade de crianças"
                  min="0"
                  class="input-field"
                />
              </div>

              <div class="input-wrapper">
                <label for="sitio-days" class="input-label">Dias</label>
                <input
                  id="sitio-days"
                  name="sitio-days"
                  type="number"
                  placeholder="Ex: 3"
                  min="1"
                  max="30"
                  class="input-field"
                />
              </div>

              <div class="switch-row">
                <div class="switch-info">
                  <span class="switch-label-text">Destilados</span>
                  <span class="switch-hint">Reduz cerveja e adiciona dose</span>
                </div>
                <label class="toggle-switch">
                  <input type="checkbox" id="destilados-sitio" onchange="toggleDestilados('sitio')">
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                </label>
              </div>

              <div id="destilados-options-sitio" class="intensity-wrapper hidden">
                <label class="input-label">Quantidade de destilados</label>
                <div class="intensity-btns">
                  <button type="button" class="intensity-btn active" data-level="pouco" onclick="setIntensity('sitio', 'pouco')">Pouco</button>
                  <button type="button" class="intensity-btn" data-level="medio" onclick="setIntensity('sitio', 'medio')">Médio</button>
                  <button type="button" class="intensity-btn" data-level="muito" onclick="setIntensity('sitio', 'muito')">Muito</button>
                </div>
              </div>

              <button class="btn btn-primary" onclick="calcSitio()">Calcular</button>
            </form>
            <div id="sitio-result" class="result-container"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="./scripts/script.js"></script>
  </body>
</html>
